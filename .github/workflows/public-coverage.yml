name: Daily public article coverage
on:
  schedule:
    - cron: '37 3 * * *'
      timezone: America/Chicago
    - cron: '37 12,18,21 * * *'
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      current_day:
        description: Check today's public output so far
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python -m unittest discover -s tests -p 'test_public_coverage.py'
      - name: Check public output for the Chicago publication day
        env:
          CURRENT_DAY: ${{ github.event.schedule == '37 12,18,21 * * *' || inputs.current_day == true }}
        run: |
          args=(--report public-coverage.json)
          if [[ "$CURRENT_DAY" == true ]]; then args+=(--current-day); fi
          python scripts/audit_publication.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-coverage
          path: public-coverage.json
          retention-days: 30
  schedules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python -m unittest discover -s tests -p 'test_publisher_schedules.py'
      - name: Check scheduled starts and completed runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publisher_schedules.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-schedules
          path: publisher-schedules.json
          retention-days: 30
