name: Daily public article coverage
on:
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python -m unittest discover -s tests -p 'test_public_coverage.py'
      - name: Check previous Chicago day
        run: python scripts/audit_publication.py --report public-coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-coverage
          path: public-coverage.json
          retention-days: 30
