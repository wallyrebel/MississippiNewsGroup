[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
  included_files = ["content/**"]

# Redirect for admin panel
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Clean URL for hiring modal
[[redirects]]
  from = "/hiring"
  to = "/#hiring"
  status = 302

# Dedicated weather page and cache policy. Weather JSON uses per-feed function TTLs.
[[redirects]]
  from = "/weather/live"
  to = "/weather/index.html"
  status = 200

[[redirects]]
  from = "/weather"
  to = "/weather/index.html"
  status = 200

[[headers]]
  for = "/weather/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/weather"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
