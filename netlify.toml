[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
  included_files = ["content/**"]

# Redirect for admin panel
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Clean URL for hiring modal
[[redirects]]
  from = "/hiring"
  to = "/#hiring"
  status = 302
